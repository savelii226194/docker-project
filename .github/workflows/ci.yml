name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Привет из пайплайна"
      - run: pwd
      - run: ls -la

  test:
    runs-on: ubuntu-latest
    environment: training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8 pytest
      - run: cd check-db && flake8 . --max-line-length=100
      - run: cd check-db && pytest
      - name: Проверить получение секретов
        env:
          TRAINING_MESSAGE: ${{ secrets.TRAINING_MESSAGE }}
          TRAINING_TARGET: ${{ secrets.TRAINING_TARGET }}
        run: |
          test -n "$TRAINING_MESSAGE"
          test -n "$TRAINING_TARGET"
          echo "Секреты репозитория и окружения training получены"
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать веб-приложение
        run: docker build --build-arg APP_VERSION="$GITHUB_SHA" -t deploy-web:ci ./deploy-web
      - run: docker save deploy-web:ci -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - run: docker load -i image.tar
      - name: Войти в Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Назначить имя и версию образа
        run: docker tag deploy-web:ci "$DOCKERHUB_USERNAME/deploy-web:$GITHUB_SHA"
      - name: Отправить образ в Docker Hub
        run: docker push "$DOCKERHUB_USERNAME/deploy-web:$GITHUB_SHA"
