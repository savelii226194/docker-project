name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Привет из пайплайна"
      - run: pwd
      - run: ls -la

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8 pytest
      - run: cd check-db && flake8 . --max-line-length=100
      - run: cd check-db && pytest
      - name: Проверить получение секрета
        env:
          TRAINING_MESSAGE: ${{ secrets.TRAINING_MESSAGE }}
        run: |
          test -n "$TRAINING_MESSAGE"
          echo "Учебный секрет получен"
